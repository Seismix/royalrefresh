name: Check version bump

# main only receives release merges from dev (dev is the default branch, so the
# scheduled canary and Dependabot never need a fix landed on main directly), and
# every release needs a new version, so every PR here must bump it.
#
# No `paths-ignore:` on purpose. This is a required status check, and a
# workflow skipped by a path filter never reports a status at all, so the check
# sits on "Expected" forever and the PR can never merge.
on:
    pull_request:
        branches: [main]
        types: [opened, reopened, synchronize, ready_for_review]

jobs:
    semver-check:
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        runs-on: ubuntu-latest

        steps:
            - name: Checkout PR branch
              uses: actions/checkout@v7

            - name: Fetch main branch
              run: git fetch origin main

            - name: Compare package.json versions
              run: |
                  PR_VERSION=$(jq -r '.version' package.json)
                  MAIN_VERSION=$(git show origin/main:package.json | jq -r '.version')

                  echo "Main branch version: $MAIN_VERSION"
                  echo "PR branch version:   $PR_VERSION"

                  if [ "$PR_VERSION" = "$MAIN_VERSION" ]; then
                    echo "❌ Version not updated!"
                    exit 1
                  else
                    echo "✅ Version updated."
                  fi
