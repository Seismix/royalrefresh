# `engines.node` in package.json is only a WARNING to pnpm on its own — install
# still exits 0 on a too-old runtime and the build fails later, somewhere less
# obvious. This turns the floor into a hard error at install time.
engineStrict: true

# GHSA-gcqx-w48m-w2h4 (deepmerge <=4.3.1, prototype poisoning) has no patched
# release to pin to. deepmerge is only reached at build time, merging our own
# config objects (vite-plugin-svelte options, addons-linter rules) — no
# attacker-supplied object is ever merged, and nothing of it ships in the
# bundle. Drop the ignore once a fixed deepmerge exists and the parents take it.
auditConfig:
  ignoreGhsas:
    - GHSA-gcqx-w48m-w2h4
